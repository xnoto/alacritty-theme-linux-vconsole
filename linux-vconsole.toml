# linux-vconsole.toml
# A seamless transition theme for Alacritty.
# Replicates the "naturally occurring" colors of a modern Linux Virtual Console (TTY)
# as rendered through the DRM/KMS Framebuffer (fbcon).

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#000000'
foreground = '#a4a4a4'

[colors.normal]
black   = '#000000'
red     = '#aa0000' # Standard VGA Red (for backgrounds)
green   = '#3cb83c' # Matched to fbcon rendering
yellow  = '#aa5500' # Standard VGA Yellow/Brown
blue    = '#0000aa' # Standard VGA Blue
magenta = '#aa00aa'
cyan    = '#00aaaa'
white   = '#a4a4a4'

[colors.bright]
black   = '#555555'
red     = '#ff5555' # High-intensity TTY Red
green   = '#66b347' # High-intensity TTY Green (Alabaster-like)
yellow  = '#ffff55' # High-intensity TTY Yellow
blue    = '#5555ff' # High-intensity TTY Blue
magenta = '#ff55ff'
cyan    = '#55ffff'
white   = '#ffffff' # Bold/Bright White
